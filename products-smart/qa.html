<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Products smart page checks</title><button id="interactions">Test product discovery and comparison</button><button id="layouts">Test mobile and desktop layouts</button><pre id="results">Ready</pre><iframe id="page" title="Products preview" src="./products.html" style="width:1280px;height:950px;border:0"></iframe><script>
const frame=document.querySelector('#page'),report=document.querySelector('#results'),tests=[];
const assert=(v,m)=>{if(!v)throw Error(m)};function add(name,fn){try{fn();tests.push({name,pass:true})}catch(e){tests.push({name,pass:false,error:e.message})}show()}function show(){report.textContent=JSON.stringify({passed:tests.filter(t=>t.pass).length,failed:tests.filter(t=>!t.pass).length,tests},null,2)}
const doc=()=>frame.contentDocument;const visible=()=>[...doc().querySelectorAll('.p-grid>.p-card')].filter(c=>!c.hidden);const set=(el,value,type='input')=>{el.value=value;el.dispatchEvent(new Event(type,{bubbles:true}))};
document.querySelector('#interactions').onclick=()=>{const d=doc(),q=d.querySelector('#product-search'),reset=()=>d.querySelector('[data-store-reset]').click();reset();add('All 11 paid products and 22 checkout links remain',()=>{assert(visible().length===11,'Product count');assert(d.querySelectorAll('.p-grid a[href^="/checkout.html"]').length===22,'Checkout links')});add('Resume intent search',()=>{set(q,'resume');assert(visible().length===1&&visible()[0].id==='resume-job-hunt-ai-pack','Wrong resume result')});reset();add('Goal-based career discovery',()=>{d.querySelector('[data-product-goal="career"]').click();assert(visible().length===1&&visible()[0].id==='resume-job-hunt-ai-pack','Career result')});reset();add('Empty results and reset',()=>{set(q,'zzzznotaproduct');assert(visible().length===0&&!d.querySelector('[data-store-empty]').hidden,'Empty state');reset();assert(visible().length===11,'Reset')});add('INR price ordering',()=>{set(d.querySelector('#product-sort'),'low','change');assert(visible()[0].querySelector('.p-price').textContent.includes('149'),'Lowest price');set(d.querySelector('#product-sort'),'high','change');assert(visible()[0].id==='ai-receptionist-setup','Highest price');reset()});add('Save product and saved-only filter',()=>{const b=d.querySelector('[data-product-save="ai-learning-kit"]');if(b.getAttribute('aria-pressed')==='true')b.click();b.click();d.querySelector('[data-store-saved]').click();assert(visible().some(c=>c.id==='ai-learning-kit'),'Saved product missing');b.click();reset()});add('Compare three products with full displayed prices',()=>{d.querySelector('[data-clear-compare]').click();for(const id of ['ai-learning-kit','ai-prompt-library','ai-knowledge-membership'])d.querySelector('[data-product-compare="'+id+'"]').click();d.querySelector('[data-open-compare]').click();const dialog=d.querySelector('#product-compare-dialog');assert(dialog.open,'Dialog did not open');assert(dialog.querySelectorAll('thead th').length===4,'Wrong comparison columns');assert(dialog.textContent.includes('/month'),'Membership period missing');d.querySelector('[data-close-compare]').click();assert(!dialog.open,'Dialog did not close')});add('Fourth comparison choice is rejected with explanation',()=>{const c=d.querySelector('[data-product-compare="live-ai-training"]');c.click();assert(!c.checked,'Fourth choice accepted');assert(d.querySelector('[data-compare-notice]').textContent.includes('three'),'No limit explanation');d.querySelector('[data-clear-compare]').click()});add('Original descriptions remain expandable',()=>{assert(d.querySelectorAll('.p-smart-inside').length===11,'Missing descriptions');const item=d.querySelector('.p-smart-inside');item.open=true;assert(item.textContent.length>100,'Description lost');item.open=false});add('Pause animation',()=>{const b=d.querySelector('[data-store-motion]');if(b.getAttribute('aria-pressed')==='true')b.click();b.click();assert(frame.contentWindow.getComputedStyle(d.querySelector('.p-smart-cover')).animationName==='none','Motion not stopped');b.click()});add('External catalog sections retained',()=>{assert(d.querySelector('#ai-free')&&d.querySelector('#ai-plus'),'Catalog missing')});reset()};
document.querySelector('#layouts').onclick=async()=>{for(const width of [390,768,1280])for(const theme of ['light','dark']){frame.style.width=width+'px';doc().documentElement.dataset.theme=theme;await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));add(width+'px '+theme+' layout',()=>{const d=doc();assert(d.documentElement.scrollWidth<=width+2,'Horizontal overflow');const headingColor=frame.contentWindow.getComputedStyle(d.querySelector('.p-hero h1')).color.match(/[\d.]+/g).slice(0,3).map(Number);assert(headingColor.reduce((a,b)=>a+b,0)>600,'Hero heading contrast');const box=d.querySelector('.p-smart-controls').getBoundingClientRect();assert(box.width>0&&box.width<=width,'Controls overflow');for(const b of d.querySelectorAll('.p-grid .p-pay a'))assert(b.getBoundingClientRect().width>0,'Purchase link hidden');assert(d.querySelector('.p-grid img').complete&&d.querySelector('.p-grid img').naturalWidth>0,'Product cover failed')})}};
</script></html>
