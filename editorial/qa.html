<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Editorial staging checks</title><button id="run">Check all guide layouts</button><pre id="results">Ready</pre><iframe id="sample" title="Article layout check" style="height:900px;border:0"></iframe><script>
const slugs=['make-photo-50kb-without-losing-readability','combine-photos-into-one-pdf-step-by-step','merge-pdf-files-correct-order-checklist','freelance-invoice-pdf-checklist','qr-code-for-business-scan-test-guide','json-formatting-vs-validation-explained','utm-links-naming-convention-small-business','generate-strong-password-browser-safely','add-pdf-watermark-without-covering-text','crop-image-pixels-vs-file-size'];document.querySelector('#run').onclick=async()=>{let tests=[];const f=document.querySelector('iframe');for(const width of [390,1280])for(const slug of slugs){f.style.width=width+'px';try{await new Promise((resolve,reject)=>{let t=setTimeout(()=>reject(Error('Load timeout')),15000);f.onload=()=>{clearTimeout(t);resolve()};f.src='./blog/'+slug+'.html'});const d=f.contentDocument;await Promise.all([...d.querySelectorAll('main img')].map(i=>i.decode()));const h=d.querySelector('h1');if(!h)throw Error('No heading');if(d.documentElement.scrollWidth>width+2)throw Error('Horizontal overflow');if(!d.querySelector('main img').naturalWidth)throw Error('Image failed');tests.push({slug,width,pass:true});}catch(e){tests.push({slug,width,pass:false,error:e.message})}document.querySelector('#results').textContent=JSON.stringify({passed:tests.filter(t=>t.pass).length,failed:tests.filter(t=>!t.pass).length,tests},null,2)} };
</script></html>
