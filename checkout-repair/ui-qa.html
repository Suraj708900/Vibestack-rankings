<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Checkout UI QA</title><style>body{font:16px system-ui;background:#10111c;color:white;padding:20px}iframe{height:950px;border:0;background:white}pre{white-space:pre-wrap}</style><h1>Checkout repair QA</h1><button id="run">Run layout checks</button><pre id="report">Ready</pre><div id="frames"></div><script>
let rows=[];function check(name,ok){rows.push({name,passed:!!ok});document.querySelector('#report').textContent=JSON.stringify({passed:rows.filter(x=>x.passed).length,failed:rows.filter(x=>!x.passed).length,checks:rows},null,2)}
function load(path,width){return new Promise(resolve=>{let f=document.createElement('iframe');f.width=width;f.src=path;f.onload=()=>setTimeout(()=>resolve(f),800);document.querySelector('#frames').append(f)})}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{for(const width of [390,768,1280]){let f=await load('checkout.html?p=ai-prompt-library&m=paypal',width),d=f.contentDocument,form=d.querySelector('#co-details');check(width+'px order form renders before loading the QR library',!!form&&!!d.querySelector('button[type=submit]')&&!d.querySelector('.co-qr'));check(width+'px no horizontal overflow',d.documentElement.scrollWidth<=d.documentElement.clientWidth+2);check(width+'px honeypot is hidden',form&&getComputedStyle(form.elements.namedItem('company').parentElement).display==='none');check(width+'px PayPal method and product price shown',form?.elements.namedItem('method').value==='paypal'&&d.querySelector('.co-amt').textContent.includes('149.00'));check(width+'px email and name fields required',form?.elements.namedItem('email').required&&form.elements.namedItem('name').required);check(width+'px ad/consent script retained',!!d.querySelector('script[src*="consent.js"]'));f.remove();}
let f=await load('contact.html',390),d=f.contentDocument,form=d.querySelector('#auf-contact-form');check('Working contact form replaces mailto-only experience',!!form&&form.querySelector('textarea').required);check('Contact spam field hidden',getComputedStyle(form.elements.namedItem('website').parentElement).display==='none');check('Mobile contact form fits viewport',d.documentElement.scrollWidth<=d.documentElement.clientWidth+2);f.remove();
f=await load('order-status.html',390);d=f.contentDocument;check('Private tracking page has no analytics/ad scripts',![...d.scripts].some(s=>/consent|analytics|gtag|adsense/.test(s.src)));check('Tracking page is noindex and no-referrer',!!d.querySelector('meta[name=robots][content="noindex,nofollow"]')&&!!d.querySelector('meta[name=referrer][content="no-referrer"]'));f.remove();}catch(e){check(e.message,false)}document.body.dataset.done='true'};
</script></html>
